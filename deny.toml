[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

# This section is considered when running `cargo deny check advisories`
# More documentation for the advisories section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
ignore = [
  # Unmaintained: oci_spec -> getset -> proc-macro-error2
  # See https://github.com/youki-dev/oci-spec-rs/issues/340
  "RUSTSEC-2026-0173",
  # Unmaintained: postcard -> heapless -> atomic-polyfill
  # See https://github.com/jamesmunns/postcard/issues/223
  "RUSTSEC-2023-0089",
  # Unmaintained: route_manager -> netlink-packet-core -> paste
  # See https://github.com/rust-netlink/netlink-packet-core/issues/41
  "RUSTSEC-2024-0436",
]

# This section is considered when running `cargo deny check bans`.
# More documentation about the 'bans' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

# This section is considered when running `cargo deny check licenses`
# More documentation for the licenses section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "WTFPL",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = [
    { allow = ["LGPL-3.0-only WITH LGPL-3.0-linking-exception"], crate = "hakoniwa" },
    { allow = ["GPL-3.0-only"], crate = "hakoniwa-cli" },
]

[licenses.private]
ignore = false
registries = []

# This section is considered when running `cargo deny check sources`.
# More documentation about the 'sources' section can be found here:
# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
