name: Continuous Integration

on:
  push:
    branches:
      - main
    paths:
      - "hakoniwa/**"
      - "hakoniwa-cli/**"
      - "Cargo.*"
  pull_request:
    branches:
      - main
    paths:
      - "hakoniwa/**"
      - "hakoniwa-cli/**"
      - "Cargo.*"

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install libseccomp
        run: |
          sudo apt-get update
          sudo apt install libseccomp-dev
      - uses: taiki-e/install-action@v2.87.21
        with:
          tool: cargo-deny,cargo-hack
      - name: Run cargo check
        run: |
          cargo deny --all-features --log-level error check
          cargo hack check --feature-powerset --no-dev-deps

  lints:
    name: Lints
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Run cargo clippy
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    needs:
      - check
      - lints
    steps:
      - name: DONOT restrict unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install libseccomp
        run: |
          sudo apt-get update
          sudo apt install libseccomp-dev
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Test library with all features
        run: timeout 5m cargo test --all-features --all-targets -p hakoniwa -- --nocapture
      - name: Test library documentation examples
        run: timeout 5m cargo test --all-features --doc -p hakoniwa -- --nocapture
      - name: Test cli with all features
        if: matrix.os == 'ubuntu-24.04'
        run: timeout 5m cargo test --all-features --all-targets -p hakoniwa-cli -- --nocapture
      - name: Test cli documentation examples
        if: matrix.os == 'ubuntu-24.04'
        run: timeout 5m cargo test --all-features --doc -p hakoniwa-cli -- --nocapture
