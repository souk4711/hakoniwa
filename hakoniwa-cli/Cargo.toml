[package]
name = "hakoniwa-cli"
version = "1.7.1"
description = "Process isolation for Linux using namespaces, resource limits, cgroups, landlock and seccomp."
keywords = ["security", "sandbox", "container", "process"]
categories = ["security"]
homepage = "https://github.com/souk4711/hakoniwa"
repository = "https://github.com/souk4711/hakoniwa"
include = ["src/**/*", "LICENSE", "../README.md"]
license = "GPL-3.0-only"
readme = "../README.md"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.0", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
clap_complete = "4.6.5"
env_logger = "0.11.10"
futures = "0.3.32"
glob = "0.3.3"
log = "0.4.29"
minijinja = { version = "2.19.0", features = ["loader"] }
netdev = "0.43.0"
netstack-smoltcp = "0.2.2"
nix = { version = "0.29.0", features = ["user"] }
parse-size = "1.1.0"
rust-embed = "8.11.0"
serde = "1.0.228"
serde_json = "1.0.149"
socket2 = "0.6.3"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
tun-rs = { version = "2.8.3", features = ["async", "async_framed"] }

[dependencies.hakoniwa]
version = "1.7.0"
path = "../hakoniwa"
features = ["cgroups", "landlock", "seccomp", "rustslirp"]

[dev-dependencies]
trycmd = "1.2.0"

[[bin]]
name = "hakoniwa"
path = "src/main.rs"
